<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cumbre Urbana</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.cumbreurbana.com/en/" />
    <link rel="alternate" hreflang="en" href="https://www.cumbreurbana.com/en/" />
    <link rel="alternate" hreflang="es" href="https://www.cumbreurbana.com/es/" />
    <link rel="alternate" hreflang="x-default" href="https://www.cumbreurbana.com/en/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta http-equiv="refresh" content="0; url=/en/" />
    <script>
      (function () {
        var locales = ["en","es"];
        var stored = null;
        try { stored = localStorage.getItem('cu.locale'); } catch (e) {}
        var preferred = (navigator.languages || [navigator.language || ''])
          .map(function (tag) { return String(tag).slice(0, 2).toLowerCase(); })
          .filter(function (tag) { return locales.indexOf(tag) !== -1; })[0];
        var target = '/' + (locales.indexOf(stored) !== -1 ? stored : preferred || 'en') + '/';
        location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 3rem">
      <a href="/en/">English</a> · <a href="/es/">Español</a>
    </p>
  </body>
</html>
